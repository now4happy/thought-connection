# 생각의 연결 — Gemini 중계 서버 설정 (v3.3.8-제안)
name = "thought-connection-gemini"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# 무료 등급이 있는 모델 (Google 공식 문서 확인, 2026-11-01)
GEMINI_MODEL = "gemini-3.6-flash"
# 페이지를 올린 주소(도메인까지만, 끝에 / 없이). 여러 개면 쉼표로 구분.
# 예: GitHub Pages(now4happy/thought-connection) → https://now4happy.github.io
ALLOWED_ORIGINS = "https://now4happy.github.io"

# GEMINI_API_KEY 는 여기에 쓰지 않는다. 비밀값으로 넣는다:
#   npx wrangler secret put GEMINI_API_KEY
